and video evaluation.</p></div><div class="feature"><div class="symbol">↗</div><h3>Track your progress</h3><p>Build good habits, see your improvement and practise towards your own speaking goals.</p></div><div class="feature"><div class="symbol">◎</div><h3>Personalised journeys</h3><p>Find prompts, speech-building tools and practice exercises relevant to your situation.</p></div></div></div></section>'}function cta(){return '<section class="section alt"><div class="wrap"><div class="banner"><div><div class="eyebrow" style="color:#56E6CF">EVERY VOICE MATTERS</div><h2>Confidence is built, not born.</h2><p>Discover a speaking journey designed for you.</p></div><a class="button" href="#/segments">Explore all journeys →</a></div></div></section>'}function segment(s){document.documentElement.style.setProperty('--accent',s[2]);return '<div class="detail" style="--accent:'+s[2]+'">'+hero(s[3].replace(/\.(?=\s)/,'.<br>'),s[4],s[1],s[2],true)+'<section class="section"><div class="wrap"><div class="eyebrow">YOUR '+s[1].toUpperCase()+' JOURNEY</div><h2 class="section-title">Built around how you speak.</h2><p class="section-intro">A tailored starting point for '+s[1].toLowerCase()+' communication. Explore the kinds of experiences this journey could offer.</p><div class="features">'+s.slice(5).map((f,i)=>'<div class="feature"><div class="symbol" style="color:'+s[2]+'">'+['◈','◎','↗'][i]+'</div><h3>'+f+'</h3><p>Focused practice and personalised guidance for '+f.toLowerCase()+'. Coming in a future product iteration.</p></div>').join('')+'</div></div></section>'+journeys()+cta()+'</div>'}function render(){let p=path();document.documentElement.style.setProperty('--accent','#00C6A4');if(p[0]==='segment'){let s=S.find(x=>x[0]===p[1]);app.innerHTML=s?segment(s):home();document.title=(s?s[1]+' | ':'')+'SpeakStrong Brand Preview'}else if(p[0]==='segments'){app.innerHTML='<section class="section"><div class="wrap"><div class="eyebrow">EXPLORE SPEAKSTRONG</div><h1 class="section-title">One
