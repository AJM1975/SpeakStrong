h</h3><p>Get constructive feedback on structure, language and delivery, with future audio and video evaluation.</p></div><div class="feature"><div class="symbol">↗</div><h3>Track your progress</h3><p>Build good habits, see your improvement and practise towards your own speaking goals.</p></div><div class="feature"><div class="symbol">◎</div><h3>Personalised journeys</h3><p>Find prompts, speech-building tools and practice exercises relevant to your situation.</p></div></div></div></section>'}function cta(){return '<section class="section alt"><div class="wrap"><div class="banner"><div><div class="eyebrow" style="color:#56E6CF">EVERY VOICE MATTERS</div><h2>Confidence is built, not born.</h2><p>Discover a speaking journey designed for you.</p></div><a class="button" href="#/segments">Explore all journeys →</a></div></div></section>'}function segment(s){document.documentElement.style.setProperty('--accent',s[2]);return '<div class="detail" style="--accent:'+s[2]+';--detail-photo:url(https://images.unsplash.com/photo-'+({toastmasters:'1475721027785-f74eccf877e2',corporate:'1552664730-d307ca884978',social:'1529156069898-49953e39b3ac',weddings:'1519741497674-611481863552',legal:'1589829545856-d10d557cf95f',education:'1427504494785-3a9ca7044f45'}[s[0]])+'?w=1100&auto=format&fit=crop&q=85)">'+hero(s[3].replace(/\.(?=\s)/,'.<br>'),s[4],s[1],s[2],true)+'<section class="section"><div class="wrap"><div class="eyebrow">YOUR '+s[1].toUpperCase()+' JOURNEY</div><h2 class="section-title">Built around how you speak.</h2><p class="section-intro">A tailored starting point for '+s[1].toLowerCase()+' communication. Explore the kinds of experiences this journey could offer.</p><div class="features">'+s.slice(5).map((f,i)=>'<div class="feature"><div class="symbol" style="color:'+s[2]+'">'+['◈','◎','↗'][i]+'</div><h3>'+f+'</h3><p>Focused practice and personalised guidance for '+f.toLowerCase()+'. Coming in a future product iteration.</p></div>').join('')+'</div></div></section>'+journeys()+cta()+'</div>'}function render(){let p=path();document.documentElement.style.setProperty('--accent','#00C6A4');if(p[0]==='segment'){let s=S.find(x=>x[0]===p[1]);app.innerHTML=s?segment(s):home();document.title=(s?s[1]+' | ':'')+'SpeakStrong Brand Preview'}else if(p[0]==='segments'){app.innerHTML='<section class="section"><div class="wrap"><div class="eyebrow">EXPLORE SPEAKSTRONG</div><h1 class="section-title">One platform. Six journeys.</h1><p class="section-intro">Find the speaking experience that fits your world.</p><div class="cards">'+S.map(card).join('')+'</div></div></section>'+cta()}else if(p[0]==='features'){app.innerHTML=features()+journeys()}else if(p[0]==='about'){app.innerHTML=hero('Clearer words.<br><em>Stronger people.</em>','SpeakStrong is designed to make confident communication accessible, from everyday conversations to the moments that matter most.','', '#00C6A4',false)+features()+journeys()}else{app.innerHTML=home()}window.scrollTo(0,0)}addEventListener('hashchange',render);render();

function openHelp(title,body){document.getElementById('ss-help-title').textContent=title;document.getElementById('ss-help-content').innerHTML=body;help.showModal()}
document.getElementById('ss-help-open').onclick=()=>openHelp('Welcome to SpeakStrong','<p>Explore one of six speaking journeys, choose a feature and try a sample workflow. This is an interactive product concept, not a live coaching service.</p><div class="ss-callout">No sign-in or payment is required. Your inputs are not submitted to an AI service.</div><p><b>Start here:</b> Open Explore SpeakStrong, select a segment and choose a feature. Use the in-page help buttons for guided instructions.</p><p><b>Free vs Pro:</b> Labels illustrate a possible future subscription structure and do not indicate a purchasable service.</p>');
function stepHtml(type){return (INFO[type]||INFO.practice).map((x,i)=>'<div class="ss-step"><b>'+(i+1)+'</b><div><strong>'+esc(x)+'</strong><span>Suggested step for exploring this prototype</span></div></div>').join('')}
function faq(){return '<section class="ss-extra"><div class="wrap"><div class="eyebrow">HELP CENTRE</div><h2 class="section-title">Good questions, clear answers.</h2><div class="ss-faq"><details><summary>What is SpeakStrong?</summary><p>A proposed speaking development platform offering tailored practice experiences for different audiences and situations.</p></details><details><summary>Does the AI coach work yet?</summary><p>Not in this prototype. The current speech builder, evaluation and progress experiences demonstrate user interfaces and illustrative logic only.</p></details><details><summary>What is included for free?</summary><p>The product concept envisages free starter tools and advanced subscription experiences. Pricing and entitlements are not finalised.</p></details><details><summary>Can I save my work?</summary><p>In this preview you can download or copy some sample outputs, and store personal demo notes in this browser. No cloud account or cross-device syncing is provided.</p></details><details><summary>Is this suitable for children or legal professionals?</summary><p>These are early concept journeys. Education features would require age-appropriate safeguards; legal exercises are communication practice, not legal advice.</p></details><details><summary>How can I give feedback?</summary><p>Use the Feedback button in the preview to record what worked, what felt confusing or what you would change.</p></details></div></div></section>'}
function toolbar(){
const p=path(),s=S.find(x=>x[0]===p[1]);if(!s)return '';
const item=p[0]==='demo'?C[s[0]][Number(p[2])]:null;
return '<div class="ss-tools"><button id="ss-context-help">ⓘ How this works</button><button id="ss-feedback-btn">✎ Give feedback</button><button id="ss-copy-link">↗ Copy link</button>'+(item?'<span class="ss-badge '+(item[3]==='evaluate'?'paid':'')+'">'+(item[3]==='evaluate'?'PRO CONCEPT':'FREE STARTER CONCEPT')+'</span>':'')+'</div>'
}
function attach(){
const p=path();if(!['segment','demo'].includes(p[0]))return;
const s=S.find(x=>x[0]===p[1]);if(!s)return;
const item=p[0]==='demo'?C[s[0]][Number(p[2])]:null;
const host=p[0]==='demo'?document.querySelector('.demo-head'):document.querySelector('.detail .hero-grid');
if(host){let wrap=document.createElement('div');wrap.style.width='100%';wrap.innerHTML=toolbar();host.insertAdjacentElement('afterend',wrap);if(p[0]==='segment'){wrap.className='wrap';wrap.style.paddingBottom='16px';}}
document.getElementById('ss-context-help')?.addEventListener('click',()=>openHelp(item?'Using '+item[0]:'Exploring '+s[1],'<p>'+(item?esc(item[1]):'Choose a feature to explore its design and sample workflow.')+'</p>'+stepHtml(item?item[3]:'practice')+'<div class="ss-callout">This is a simulated experience. Real AI analysis, recording, accounts and scoring are not connected.</div>'));
document.getElementById('ss-copy-link')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);alert('Preview link copied')}catch(e){prompt('Copy this link:',location.href)}});
document.getElementById('ss-feedback-btn')?.addEventListener('click',feedback);
if(item&&p[0]==='demo'){
const panel=document.querySelector('.demo-panel');if(panel){
const info=document.createElement('div');info.className='ss-panel';info.innerHTML='<span class="ss-tag">FEATURE GUIDE</span><h3>What you can do here</h3><p>'+esc(item[1])+'. Follow the suggested workflow, then use the example output to understand the intended experience.</p><div class="ss-toolbar"><button id="ss-steps">View steps</button><button id="ss-copy-output">Copy result</button><button id="ss-save-output">Save demo note</button></div><p class="ss-saved" id="ss-save-msg"></p>';panel.append(info);
document.getElementById('ss-steps').onclick=()=>openHelp('Step-by-step · '+item[0],stepHtml(item[3]));
document.getElementById('ss-copy-output').onclick=async()=>{const txt=document.getElementById('d-result')?.innerText||document.querySelector('.demo-output')?.innerText||'';try{await navigator.clipboard.writeText(txt);document.getElementById('ss-save-msg').textContent='Copied to clipboard'}catch(e){document.getElementById('ss-save-msg').textContent='Copy unavailable in this browser'}};
document.getElementById('ss-save-output').onclick=()=>{const txt=document.getElementById('d-result')?.innerText||document.querySelector('.demo-output')?.innerText||'';try{localStorage.setItem('ss-demo-'+p[1]+'-'+p[2],txt);document.getElementById('ss-save-msg').textContent='Saved locally in this browser'}catch(e){document.getElementById('ss-save-msg').textContent='Local saving unavailable'}};
}
}
}
function feedback(){openHelp('Share your feedback','<p>What should we improve about this experience?</p><label class="ss-check">Feedback type <select id="ss-fb-type" class="ss-select"><option>Idea</option><option>Bug</option><option>Design feedback</option><option>Missing feature</option></select></label><textarea class="ss-feedback" id="ss-fb-text" placeholder="Tell us what you think..."></textarea><div class="ss-toolbar" style="margin-top:12px"><button id="ss-fb-save">Save feedback locally</button><button id="ss-fb-export">Download feedback</button></div><p id="ss-fb-status" class="ss-saved"></p>');const save=()=>{const txt=document.getElementById('ss-fb-text').value.trim();if(!txt){document.getElementById('ss-fb-status').textContent='Please enter feedback first';return null}const record={date:new Date().toISOString(),page:location.hash,type:document.getElementById('ss-fb-type').value,feedback:txt};let list=[];try{list=JSON.parse(localStorage.getItem('ss-feedback')||'[]')}catch(e){}list.push(record);try{localStorage.setItem('ss-feedback',JSON.stringify(list));document.getElementById('ss-fb-status').textContent='Saved in this browser only — not sent to the project team.'}catch(e){document.getElementById('ss-fb-status').textContent='Could not save locally'}return list};document.getElementById('ss-fb-save').onclick=save;document.getElementById('ss-fb-export').onclick=()=>{const list=save();if(!list)return;const blob=new Blob([JSON.stringify(list,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='speakstrong-preview-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}}
function augment(){const p=path();attach();if(!p.length||['segments','about','features'].includes(p[0])){if(!document.getElementById('ss-faq')){const d=document.createElement('div');d.id='ss-faq';d.innerHTML=faq();app.appendChild(d)}}if(p[0]==='segment'){const h=document.querySelector('.detail .demo-grid');if(h){const count=h.children.length;const intro=h.parentElement.querySelector('.section-intro');if(intro)intro.textContent='Explore '+count+' feature concepts with sample workflows, contextual guidance and interactive previews.'}}}
addEventListener('hashchange',()=>setTimeout(augment,0));setTimeout(augment,0);
})();
</script></body></html>
